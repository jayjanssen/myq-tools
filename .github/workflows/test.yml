name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test on Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: make test

      - name: Run tests with race detector
        run: make test-race

      - name: Run benchmarks (smoke test)
        run: make benchmark-ci

  test-with-mysql-versions:
    name: Test with MySQL ${{ matrix.mysql-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        mysql-version: ['8.0', '8.4', '9.5']

    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if nc -z 127.0.0.1 3306 2>/dev/null; then
              echo "MySQL port is open, waiting a bit more for initialization..."
              sleep 3
              echo "MySQL should be ready now"
              exit 0
            fi
            echo "Waiting for MySQL port to open... ($i/30)"
            sleep 2
          done
          echo "MySQL failed to become ready"
          exit 1

      - name: Run integration tests with MySQL ${{ matrix.mysql-version }}
        env:
          MYSQL_VERSION: ${{ matrix.mysql-version }}
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: testpass
        run: make test-integration
